name: standalone-server-release

on:
  push:
    tags: ["server-v*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build and publish Linux x86_64 server
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Validate tag against project version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "server-v$version"

      - name: Build standalone deployment bundle
        run: ./scripts/build-standalone.sh build

      - name: Verify release checksums
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#server-v}"
          assets=(
            "dist/coding-tools-mcp-${version}-linux-x86_64.tar.gz"
            "dist/coding-tools-mcp-linux-x86_64.tar.gz"
            "dist/SHA256SUMS"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Coding Tools MCP Server ${version}" \
              --generate-notes \
              --latest
          fi
